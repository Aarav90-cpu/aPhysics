name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true

      - name: Verify Clang version (>= 23) and environment
        run: |
          clang --version
          bazel --version
          CLANG_MAJOR=$(clang -dumpversion | cut -d. -f1)
          echo "Detected Clang major version: $CLANG_MAJOR"
          if [ "$CLANG_MAJOR" -lt 23 ]; then
            echo "Error: Clang version 23 or higher is required (found version $CLANG_MAJOR)."
            exit 1
          fi

      - name: Build project
        run: |
          bazel build //...

      - name: Run application
        run: |
          bazel run //:app

      - name: Run tests
        run: |
          bazel test --test_output=errors //...

      - name: Verify clean target
        run: |
          bazel clean

  lint-and-format:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Check code formatting (clang-format)
        run: |
          FILES=$(find src include -type f \( -name "*.c" -o -name "*.h" \))
          if [ -n "$FILES" ]; then
            clang-format --dry-run --Werror $FILES
          fi

      - name: Run static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=staticFunction \
            --suppress=checkersReport \
            --error-exitcode=1 \
            -I include \
            src/

  ci-success:
    name: CI Status Gate
    needs: [build-and-test, lint-and-format]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.lint-and-format.result }}" != "success" ]; then
            echo "CI checks failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
