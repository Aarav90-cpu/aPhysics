name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 23 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -O - https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo ln -sf /usr/bin/clang-23 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-23 /usr/local/bin/clang++

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true

      - name: Verify Clang version and environment
        run: |
          clang --version
          bazel --version
          if [ "${{ runner.os }}" = "Linux" ]; then
            CLANG_MAJOR=$(clang -dumpversion | cut -d. -f1)
            echo "Detected Linux Clang version: $CLANG_MAJOR"
            if [ "$CLANG_MAJOR" -lt 23 ]; then
              echo "Error: Clang version 23 or higher is required on Linux (found version $CLANG_MAJOR)."
              exit 1
            fi
          else
            echo "macOS platform: Running with host Apple Clang / Xcode toolchain (experimental)."
          fi

      - name: Build project
        run: |
          bazel build //...

      - name: Run application
        run: |
          bazel run //:app

      - name: Run tests
        run: |
          bazel test --test_output=errors //...

      - name: Verify clean target
        run: |
          bazel clean

  lint-and-format:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 23 and static analysis tools
        run: |
          wget -O - https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get update
          sudo apt-get install -y cppcheck
          sudo ln -sf /usr/bin/clang-format-23 /usr/local/bin/clang-format || true

      - name: Check code formatting (clang-format)
        run: |
          FILES=$(find src include -type f \( -name "*.c" -o -name "*.h" \))
          if [ -n "$FILES" ]; then
            clang-format --dry-run --Werror $FILES
          fi

      - name: Run static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=staticFunction \
            --suppress=checkersReport \
            --error-exitcode=1 \
            -I include \
            src/

  ci-success:
    name: CI Status Gate
    needs: [build-and-test, lint-and-format]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.lint-and-format.result }}" != "success" ]; then
            echo "CI checks failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
