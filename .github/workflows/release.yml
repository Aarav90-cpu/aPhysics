name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aphysics-linux-x86_64
            archive_name: aphysics-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: aphysics-macos-arm64
            archive_name: aphysics-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 23 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -O - https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo ln -sf /usr/bin/clang-23 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-23 /usr/local/bin/clang++

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true

      - name: Build release binary with Bazel
        run: |
          bazel build --compilation_mode=opt //tools:aphysics_info

      - name: Package release artifact
        run: |
          mkdir -p package
          cp bazel-bin/tools/aphysics_info package/${{ matrix.artifact_name }}
          cp README.md LICENSE NOTICE package/
          tar -czvf ${{ matrix.archive_name }} -C package .
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  create-github-release:
    name: Create GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_dist
          find artifacts -type f -name "*.tar.gz*" -exec cp {} release_dist/ \;
          ls -la release_dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: Release ${{ github.ref_name || github.event.inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
