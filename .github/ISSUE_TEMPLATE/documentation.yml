name: "Documentation"
description: "Suggest improvements, report missing info, or fix documentation"
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Accurate and clear documentation is vital for **aPhysics**. Thank you for helping us improve it!

  - type: textarea
    id: location
    attributes:
      label: "Documentation Location"
      description: "Which file, section, or API documentation needs attention?"
      placeholder: "e.g., README.md, docs/architecture.md, include/app.h header comments..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "What needs improvement?"
      description: "Describe what is missing, unclear, or outdated."
      placeholder: "Explain the issue with current documentation..."
    validations:
      required: true

  - type: textarea
    id: proposed-changes
    attributes:
      label: "Proposed Changes"
      description: "How should the documentation be updated or rewritten?"
      placeholder: "Provide suggested wording, code examples, or explanations..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I would like to submit a Pull Request to fix this myself."
          required: false
