name: "Bug Report"
description: "File a bug or unexpected behavior in aPhysics"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **aPhysics**!
        Please fill out this form as completely as possible so we can diagnose and fix the problem quickly.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe what went wrong..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior or a minimal code example."
      placeholder: |
        1. Initialize physics world with ...
        2. Step simulation with delta time ...
        3. Observe unexpected behavior ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: "What was supposed to happen..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened instead."
      placeholder: "What happened instead..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Operating system, compiler version, and architecture."
      placeholder: "e.g., Ubuntu 24.04 / GCC 14.2 / x86_64, macOS 15 / Apple Clang 16 / Apple Silicon"
    validations:
      required: true

  - type: input
    id: integration
    attributes:
      label: "Integration Context (if applicable)"
      description: "Details regarding Remotion, Three.js, WebAssembly, or Node integration."
      placeholder: "e.g., Remotion v4.0, Three.js r160, standalone C"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Logs or Terminal Output"
      description: "Please copy-paste any relevant terminal output, compiler errors, or stack traces."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      description: "Please confirm the following before submitting:"
      options:
        - label: "I have searched the existing issues to make sure this is not a duplicate."
          required: true
        - label: "I have tested with the latest commit on the main/master branch."
          required: false
        - label: "I have provided minimal reproducible code or steps."
          required: true
